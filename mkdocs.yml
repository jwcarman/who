site_name: Who
site_description: Identity and permissions for Spring Boot applications.
site_url: https://jwcarman.github.io/who/
repo_url: https://github.com/jwcarman/who
repo_name: jwcarman/who
edit_uri: edit/main/docs/

docs_dir: docs

validation:
  anchors: warn
  links:
    absolute_links: warn

# Process artifacts (superpowers specs and plans) stay out of the site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/jwcarman.css

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Database Setup: guides/database.md
      - JWT: guides/jwt.md
      - API Keys: guides/api-keys.md
      - Email Links: guides/email-links.md
      - Passkeys: guides/passkeys.md
      - Enrollment: guides/enrollment.md
      - RBAC and Method Security: guides/rbac.md
      - Configuration Reference: guides/configuration.md
      - Upgrading: guides/upgrading.md
  - Reference:
      - API (Javadoc): https://jwcarman.github.io/who/api/latest/
      - Changelog: https://github.com/jwcarman/who/blob/main/CHANGELOG.md
