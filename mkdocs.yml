site_name: Who
site_description: Identity and permissions for Spring Boot applications.
site_url: https://jwcarman.github.io/who/
repo_url: https://github.com/jwcarman/who
repo_name: jwcarman/who
edit_uri: edit/main/docs/

docs_dir: docs

validation:
  anchors: warn
  links:
    absolute_links: warn

# Process artifacts (superpowers specs and plans) stay out of the site.
exclude_docs: |
  /superpowers/
  /requirements.*

theme:
  name: material
  logo: assets/logo/who-mark.svg
  favicon: assets/logo/who-badge.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Source Sans 3
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

# Declaring plugins replaces MkDocs' default list, so search is named here too.
plugins:
  - search
  # https://llmstxt.org: an index of the docs for coding agents at /llms.txt, every page in
  # one file at /llms-full.txt, and a Markdown copy of each page beside its HTML.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        who is a Spring Boot 4 library: add the starter and a module per sign-in method, and an app
        gets passwordless sign-in by emailed link or code, passkeys, Google, GitHub or OpenID Connect
        sign-in, API keys and JWTs, all resolving to one identity with roles and permissions checked
        by `@RequiresPermission`. Maven coordinates: `org.jwcarman.who`; import `who-bom` and add
        `who-spring-boot-starter` plus the modules you want. The changelog says what each version
        has: https://github.com/jwcarman/who/blob/main/CHANGELOG.md. API reference (Javadoc):
        https://jwcarman.github.io/who/api/latest/. An Agent Skill packages these guides for coding
        agents: see the Agent Skill page.
      sections:
        Start here:
          - index.md: what who is and which module does what
          - guides/getting-started.md: adding who to a project, the default chain, chains of your own, creating and deleting identities
          - guides/configuration.md: the exact name and default of any who.* property, and every endpoint path
          - guides/database.md: creating who's tables, Flyway or Liquibase copies of the schema
        Signing in:
          - guides/email-links.md: sign-in by emailed link or code, sending mail, adding or changing an address, the Turnstile human check, rate limiting
          - guides/passkeys.md: passkey sign-in and registration, rp-id and origins, the "passkey added" email
          - guides/social-login.md: Google, GitHub or any OpenID Connect provider, who may sign up, linking accounts
          - guides/api-keys.md: issuing, rotating and revoking API keys, scopes, the key header
          - guides/jwt.md: accepting JWTs from an authorization server
          - guides/enrollment.md: linking a JWT or provider credential to an identity with enrollment tokens
          - guides/sessions.md: listing and ending sessions, sign-out, the last-sign-in cookie, purging old session records
          - guides/client.md: the @jwcarman/who-client TypeScript client for browser pages
        Permissions and security:
          - guides/rbac.md: roles, permissions, @RequiresPermission
          - guides/security-model.md: what each check protects against, recent sign-in and @RequiresRecentSignIn
          - guides/errors.md: who's exceptions, the Who-Error codes, answering them in the app's format
        Operating:
          - guides/testing.md: testing an app built on who with who-test
          - guides/events.md: reacting to sign-ins and other security events
          - guides/observability.md: metrics, traces, the startup log lines, alerts
          - guides/native.md: GraalVM native images
          - guides/upgrading.md: moving a project from one who version to another
        Optional:
          - agent-skill.md: installing who's Agent Skill in Claude Code, Codex, Cursor and other agents

extra_css:
  - stylesheets/jwcarman.css
  - stylesheets/who.css

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Database Setup: guides/database.md
      - JWT: guides/jwt.md
      - API Keys: guides/api-keys.md
      - Email Links: guides/email-links.md
      - Passkeys: guides/passkeys.md
      - Social Login: guides/social-login.md
      - Sessions: guides/sessions.md
      - TypeScript Client: guides/client.md
      - Events: guides/events.md
      - Observability: guides/observability.md
      - Native Images: guides/native.md
      - Enrollment: guides/enrollment.md
      - RBAC and Method Security: guides/rbac.md
      - Errors: guides/errors.md
      - Security Model: guides/security-model.md
      - Testing: guides/testing.md
      - Configuration Reference: guides/configuration.md
      - Upgrading: guides/upgrading.md
  - Agent Skill: agent-skill.md
  - Reference:
      - API (Javadoc): https://jwcarman.github.io/who/api/latest/
      - Changelog: https://github.com/jwcarman/who/blob/main/CHANGELOG.md
