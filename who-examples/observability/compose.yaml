# Spring Boot starts these with the app (spring-boot-docker-compose) and stops them when it stops.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: who
      POSTGRES_USER: who
      POSTGRES_PASSWORD: who
    ports:
      - "5432"

  # Catches the sign-in emails: read them at http://localhost:8025. The traffic generator reads
  # codes back through its API.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # Grafana with Loki (logs), Tempo (traces) and Prometheus (metrics) behind one OpenTelemetry
  # collector. Spring Boot sends the app's metrics, traces and logs to it over OTLP. Grafana is
  # http://localhost:3000; the "who" dashboard is provisioned from ./grafana.
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3000:3000"
      - "4317"
      - "4318"
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/who.yaml:ro
      - ./grafana/who-dashboard.json:/otel-lgtm/who-dashboard.json:ro
