spring:
  application:
    name: who-example-observability

  # who signs people in, so Spring Boot's own user, with the password it prints at startup, would
  # only be noise. Boot leaves it out by itself when JWT or provider sign-in is on; this example has
  # neither, so it switches it off here.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # Mailpit, from compose.yaml. Every email lands at http://localhost:8025.
  mail:
    host: localhost
    port: 1025

who:
  # who's tables. Fine on your machine; in production use Flyway or Liquibase and set this to never.
  initialize-schema: always
  security:
    public-paths:
      - /
      - /index.html
      - /app.css
      - /js/**
  email-link:
    link-base-url: http://localhost:8080/
    from: who@example.com
    subject: Your who code
    code-secret: this-is-a-development-secret-change-it

management:
  # Push metrics every 10 seconds, so the dashboard moves while you watch. The default is a minute.
  otlp:
    metrics:
      export:
        step: 10s

  # Every request is traced, so any click on the page has a trace to open. Sample less in production.
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    # who logs why each sign-in failed at DEBUG. With the trace id on each line, a failure on the
    # dashboard leads to its log line, and the log line to its trace.
    org.jwcarman.who: DEBUG
