spring:
  application:
    name: who-example-web-and-api

  # Spring's own 400s (a malformed body, a wrong type) as ProblemDetail, like every other API error.
  mvc:
    problemdetails:
      enabled: true

  # The app's own table. Postgres itself comes from compose.yaml, through Boot's service connection.
  sql:
    init:
      mode: always

  # Mailpit, from compose.yaml. Every email lands at http://localhost:8025.
  mail:
    host: localhost
    port: 1025

  security:
    oauth2:
      # The website signs people in with Keycloak: the realm's confidential client.
      client:
        registration:
          keycloak:
            client-name: Keycloak
            client-id: who-tasks-web
            client-secret: who-tasks-web-secret
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/who/oidc/callback/{registrationId}"
        provider:
          keycloak:
            authorization-uri: http://localhost:8280/realms/who-tasks/protocol/openid-connect/auth
            token-uri: http://localhost:8280/realms/who-tasks/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8280/realms/who-tasks/protocol/openid-connect/certs
            user-info-uri: http://localhost:8280/realms/who-tasks/protocol/openid-connect/userinfo
            user-name-attribute: sub
      # The API takes access tokens from the same realm, issued for it: the audience is checked.
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/who-tasks
          audiences: who-tasks-api

who:
  # who's tables. Fine on your machine; in production use Flyway or Liquibase (see the Database
  # guide) and set this to never.
  initialize-schema: always
  security:
    public-paths:
      - /signin
      - /signin/**
      - /app.css
      - /img/**
      - /js/**
  email-link:
    link-base-url: http://localhost:8080/signin/link
    from: who@example.com
    subject: Sign in to Who Tasks
    code-secret: this-is-a-development-secret-change-it
  oidc:
    success-url: /
    failure-url: /signin
    providers:
      keycloak:
        # The same issuer as the access tokens: a person who signs in to the website with Keycloak
        # and the token their command-line tool gets are one credential, so one identity.
        issuer: http://localhost:8280/realms/who-tasks

example:
  issuer: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}
  accounts:
    - subject: a11ce000-0000-4000-8000-000000000001
      email: alice@example.com
      role: ADMIN
    - subject: b0b00000-0000-4000-8000-000000000002
      email: bob@example.com
      role: MEMBER
