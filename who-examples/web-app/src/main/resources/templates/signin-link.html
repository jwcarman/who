<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Signing in')}"></head>
<body th:attr="data-turnstile-site-key=${turnstileSiteKey}">
<main>
  <h1>Signing you in…</h1>
  <!-- the Turnstile widget, shown for each email request (see human-check.js) -->
  <div id="human-check"></div>
  <section id="failed" hidden>
    <p>This link did not work. It may have been used already, or be more than a few minutes old.</p>
    <a class="button" href="/signin">Get a new one</a>
  </section>
</main>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
        th:if="${!#strings.isEmpty(turnstileSiteKey)}"></script>
<script type="module" src="/js/signin-link.js"></script>
</body>
</html>
