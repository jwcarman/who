name: CI with Maven

on:
  # Keeps the SonarCloud token alive. A token is "never expires, if used", so a project that goes
  # quiet for a month loses it and every build after that fails on a credential nobody revoked.
  # Twice a month leaves plenty of margin against that.
  schedule:
    - cron: '0 9 1,15 * *'
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven
    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -Pci -B verify sonar:sonar
