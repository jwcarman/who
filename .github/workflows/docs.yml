name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/superpowers/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  # The API docs workflow dispatches this workflow after it updates the api-docs branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install MkDocs Material
        run: pip install --only-binary ':all:' mkdocs-material==9.7.7
      - name: Build site
        run: mkdocs build --strict
      # Every release's aggregated Javadoc lives on the api-docs branch (see api-docs.yml);
      # publish it under /api/ beside the guides. The branch does not exist before the first release
      # built with that workflow, so its absence is not an error.
      - name: Add the API docs
        run: |
          if git ls-remote --exit-code --heads origin api-docs >/dev/null; then
            git fetch --depth 1 origin api-docs
            git archive FETCH_HEAD api | tar -x -C site
          else
            echo "no api-docs branch yet"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
