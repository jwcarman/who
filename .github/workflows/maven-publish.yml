name: Publish package to the Maven Central Repository
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  # Nothing publishes unless the tag is a plain version and the npm side rehearses clean.
  # Order after that: npm first, then Maven Central only if npm succeeded, so an npm failure never
  # strands a Central release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a plain version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$RELEASE_TAG' must be a version like 1.2.3, with no 'v' prefix"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the build's node.version (pom.xml)
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
      - name: Install client dependencies
        run: npm ci --ignore-scripts
        working-directory: who-client
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version
        working-directory: who-client
      - name: Build
        run: npm run build
        working-directory: who-client
      - name: Rehearse the publish
        run: npm publish --access public --dry-run
        working-directory: who-client

  # @jwcarman/who-client, the TypeScript client, at the release's version
  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no token; provenance is generated automatically
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org
          # no restored cache in a publishing job
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          v="$(npm --version)"
          if ! printf '11.5.1\n%s\n' "$v" | sort -V -C; then
            echo "::error::npm $v is too old for trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi
      - name: Install client dependencies
        run: npm ci --ignore-scripts
        working-directory: who-client
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm version "$RELEASE_TAG" --no-git-tag-version --allow-same-version
        working-directory: who-client
      - name: Build
        run: npm run build
        working-directory: who-client
      - name: Publish package
        run: npm publish --access public
        working-directory: who-client

  maven:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    permissions:
      # write: attach the jars, their signatures and the provenance to the GitHub Release
      contents: write
      # build provenance: a signed attestation of which commit and workflow built each jar
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Maven Central Repository
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'liberica'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # The tag goes through env, not into run:, so a tag with shell metacharacters cannot inject commands.
      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mvn versions:set -DnewVersion="$RELEASE_TAG"
      - name: Publish package
        run: mvn -P release --batch-mode deploy -DskipTests -pl '!who-client,!who-examples,!who-examples/web-app,!who-examples/spa,!who-examples/api,!who-examples/web-and-api,!who-examples/observability'
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            who-*/target/who-*.jar
            who-*/target/who-*-cyclonedx.json
      # The same signed files on the release page, where verifiers (and OpenSSF Scorecard) look for
      # them: each module's jar, its GPG signature, and the provenance bundle for all of them.
      - name: Attach signed jars and provenance to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # the GPG plugin may write signatures beside the jar or under target/gpg, so search both
          mapfile -t jars < <(find who-*/target -maxdepth 1 -name "who-*-${RELEASE_TAG}.jar")
          mapfile -t sigs < <(find who-*/target -maxdepth 2 -name "who-*-${RELEASE_TAG}.jar.asc")
          echo "jars: ${#jars[@]}, signatures: ${#sigs[@]}"
          if [ "${#jars[@]}" -eq 0 ] || [ "${#jars[@]}" -ne "${#sigs[@]}" ]; then
            echo "::error::expected one signature per jar"
            exit 1
          fi
          cp "$BUNDLE" "who-$RELEASE_TAG.intoto.jsonl"
          gh release upload "$RELEASE_TAG" --clobber "${jars[@]}" "${sigs[@]}" "who-$RELEASE_TAG.intoto.jsonl"
